<div class="showcase-lightbox" id="showcase-lightbox" aria-hidden="true">
    <button class="showcase-lightbox__close" type="button" aria-label="Close screenshot preview">
        <i class="fas fa-times"></i>
    </button>
    <button class="showcase-lightbox__backdrop" type="button" aria-label="Close screenshot preview"></button>
    <div class="showcase-lightbox__content">
        <figure class="showcase-lightbox__figure">
            <img class="showcase-lightbox__image" src="" alt="Screenshot preview">
            <video class="showcase-lightbox__video" controls playsinline></video>
            <iframe class="showcase-lightbox__youtube" title="Video preview" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
            <a class="showcase-lightbox__post-link" href="" target="_blank" rel="noopener noreferrer" style="display:none">
                <i class="fas fa-arrow-up-right-from-square"></i> View original post
            </a>
        </figure>
    </div>
</div>

<script>
(function () {
    if (window.__showcaseLightboxReady) return;
    window.__showcaseLightboxReady = true;

    function getLightbox() {
        return document.getElementById('showcase-lightbox');
    }

    function openLightbox(src, alt, mediaType, postUrl) {
        var lightbox = getLightbox();
        if (!lightbox || !src) return;
        var img = lightbox.querySelector('.showcase-lightbox__image');
        var video = lightbox.querySelector('.showcase-lightbox__video');
        var youtube = lightbox.querySelector('.showcase-lightbox__youtube');
        var postLink = lightbox.querySelector('.showcase-lightbox__post-link');
        if (!img || !video || !youtube) return;
        youtube.removeAttribute('src');
        youtube.style.display = 'none';
        if (mediaType === 'video') {
            img.removeAttribute('src');
            img.style.display = 'none';
            video.src = src;
            video.style.display = 'block';
            video.load();
        } else if (mediaType === 'youtube') {
            img.removeAttribute('src');
            img.style.display = 'none';
            video.pause();
            video.removeAttribute('src');
            video.style.display = 'none';
            youtube.src = 'https://www.youtube-nocookie.com/embed/' + String(src || '').replace(/^youtube:/i, '') + '?autoplay=1';
            youtube.style.display = 'block';
        } else {
            video.pause();
            video.removeAttribute('src');
            video.style.display = 'none';
            img.src = src;
            img.alt = alt || 'Screenshot preview';
            img.style.display = 'block';
        }
        if (postLink) {
            if (postUrl) {
                postLink.href = postUrl;
                postLink.style.display = 'inline-flex';
            } else {
                postLink.style.display = 'none';
            }
        }
        lightbox.classList.add('is-open');
        lightbox.setAttribute('aria-hidden', 'false');
        document.documentElement.classList.add('showcase-lightbox-open');
    }

    function closeLightbox() {
        var lightbox = getLightbox();
        if (!lightbox) return;
        lightbox.classList.remove('is-open');
        lightbox.setAttribute('aria-hidden', 'true');
        document.documentElement.classList.remove('showcase-lightbox-open');
        var img = lightbox.querySelector('.showcase-lightbox__image');
        if (img) img.removeAttribute('src');
        var video = lightbox.querySelector('.showcase-lightbox__video');
        if (video) {
            video.pause();
            video.removeAttribute('src');
        }
        var youtube = lightbox.querySelector('.showcase-lightbox__youtube');
        if (youtube) youtube.removeAttribute('src');
    }

    document.addEventListener('click', function (event) {
        var trigger = event.target.closest('.screenshot-lightbox-trigger');
        if (trigger) {
            event.preventDefault();
            openLightbox(trigger.getAttribute('data-full') || trigger.getAttribute('href'), trigger.querySelector('img')?.alt, trigger.getAttribute('data-media-type'), trigger.getAttribute('data-post-url'));
            return;
        }
        if (event.target.closest('.showcase-lightbox__close') || event.target.closest('.showcase-lightbox__backdrop')) {
            closeLightbox();
        }
    });

    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeLightbox();
    });
})();
</script>
